<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#171f38"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#2a3452"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4b5875"/>
    </marker>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1200" height="630" fill="url(#dots)" opacity="0.55"/>

    <!-- Header -->
    <text x="80" y="76" font-size="13" font-weight="600" letter-spacing="2.5" fill="#8b96b8">CDLLIFE MOBILE APP &#183; CASE STUDY</text>
    <text x="80" y="120" font-size="36" font-weight="700" fill="#f7f9ff">AI-Powered Post Analysis Pipeline</text>
    <text x="80" y="150" font-size="16" fill="#8b96b8">Fire-and-forget content classification, built for scale and cost</text>

    <!-- Phone / source posts -->
    <rect x="110" y="250" width="100" height="180" rx="18" fill="#141b30" stroke="#2a3452" stroke-width="2"/>
    <rect x="121" y="264" width="78" height="152" rx="8" fill="#0e1424"/>
    <rect x="133" y="281" width="54" height="9" rx="4.5" fill="#3a4568"/>
    <rect x="133" y="301" width="38" height="9" rx="4.5" fill="#14b8a6" opacity="0.75"/>
    <rect x="133" y="321" width="48" height="9" rx="4.5" fill="#3a4568"/>
    <rect x="133" y="341" width="34" height="9" rx="4.5" fill="#f59e0b" opacity="0.75"/>
    <rect x="133" y="361" width="44" height="9" rx="4.5" fill="#3a4568"/>
    <rect x="133" y="381" width="30" height="9" rx="4.5" fill="#14b8a6" opacity="0.75"/>
    <text x="160" y="452" font-size="12.5" fill="#8b96b8" text-anchor="middle">10,000s of raw posts</text>

    <!-- Arrow 1 -->
    <line x1="222" y1="340" x2="298" y2="340" stroke="#4b5875" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHead)"/>

    <!-- Classifier hexagon -->
    <polygon points="463.6,297.5 463.6,382.5 390,425 316.4,382.5 316.4,297.5 390,255" fill="url(#nodeGrad)" opacity="0.35" filter="url(#softBlur)"/>
    <polygon points="463.6,297.5 463.6,382.5 390,425 316.4,382.5 316.4,297.5 390,255" fill="url(#nodeGrad)" stroke="#a5b4fc" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M390,312 L399,331 L418,340 L399,349 L390,368 L381,349 L362,340 L381,331 Z" fill="#f7f9ff"/>
    <rect x="325" y="446" width="130" height="28" rx="14" fill="#141b30" stroke="#14b8a6" stroke-width="1.3" stroke-opacity="0.6"/>
    <text x="390" y="464" font-size="12.5" fill="#c9f7ef" text-anchor="middle" font-weight="600">GPT-4o-mini</text>

    <!-- Branch arrows to outcomes -->
    <path d="M462,313 C 520,300 560,290 608,290" fill="none" stroke="#4b5875" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHead)"/>
    <path d="M462,367 C 520,380 560,390 608,390" fill="none" stroke="#4b5875" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHead)"/>

    <!-- Outcome chips -->
    <rect x="610" y="265" width="190" height="50" rx="12" fill="#141b30" stroke="#14b8a6" stroke-width="1.6"/>
    <path d="M632,290 l6,6 l12,-13" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="656" y="296" font-size="14" fill="#e6ebf7" font-weight="500">Classified &amp; Tagged</text>

    <rect x="610" y="365" width="190" height="50" rx="12" fill="#141b30" stroke="#f59e0b" stroke-width="1.6"/>
    <path d="M629,378 v20 M629,378 h14 l-4,5 l4,5 h-14" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="656" y="396" font-size="14" fill="#e6ebf7" font-weight="500">Flagged for Review</text>

    <!-- Converge to database -->
    <path d="M800,290 C 830,290 840,300 858,313" fill="none" stroke="#4b5875" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHead)"/>
    <path d="M800,390 C 830,390 840,382 858,368" fill="none" stroke="#4b5875" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHead)"/>

    <rect x="858" y="313" width="88" height="55" fill="#2a3452"/>
    <ellipse cx="902" cy="313" rx="44" ry="15" fill="#3a4568" stroke="#5b6791" stroke-width="1.3"/>
    <ellipse cx="902" cy="368" rx="44" ry="15" fill="#232c48"/>
    <text x="902" y="460" font-size="12.5" fill="#8b96b8" text-anchor="middle">MongoDB &#183; partial indexes</text>

    <!-- Tech stack row -->
    <g font-size="13" fill="#c3cbe6">
      <rect x="80" y="560" width="120" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="140" y="582" text-anchor="middle">Node.js v10</text>

      <rect x="216" y="560" width="196" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="314" y="582" text-anchor="middle">Raw HTTPS (no SDK)</text>

      <rect x="428" y="560" width="200" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="528" y="582" text-anchor="middle">SHA-256 Hashing</text>

      <rect x="644" y="560" width="150" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="719" y="582" text-anchor="middle">GPT-4o-mini API</text>
    </g>
  </g>
</svg>

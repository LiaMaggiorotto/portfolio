<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#171f38"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#2a3452"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
    <clipPath id="screenClip">
      <rect x="82" y="227" width="106" height="246" rx="8"/>
    </clipPath>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <marker id="arrowHeadTeal" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#14b8a6"/>
    </marker>
    <marker id="arrowHeadAmber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1200" height="630" fill="url(#dots)" opacity="0.55"/>

    <!-- Header -->
    <text x="80" y="76" font-size="13" font-weight="600" letter-spacing="2.5" fill="#8b96b8">CDLLIFE COPILOT &#183; DRIVER PORTAL &#183; CASE STUDY</text>
    <text x="80" y="120" font-size="34" font-weight="700" fill="#f7f9ff">Driver Job Application Portal</text>
    <text x="80" y="150" font-size="16" fill="#8b96b8">Production hardening across auth, proxy, and data ownership</text>

    <!-- Driver phone, modeled on the real sign-in screen -->
    <rect x="70" y="215" width="130" height="270" rx="22" fill="#141b30" stroke="#2a3452" stroke-width="2"/>
    <rect x="82" y="227" width="106" height="246" rx="8" fill="#ffffff"/>
    <g clip-path="url(#screenClip)">
      <!-- wordmark header -->
      <text x="135" y="246" font-size="9.5" font-weight="800" fill="#111827" text-anchor="middle" letter-spacing="0.3">CDLLIFE</text>
      <text x="135" y="257" font-size="3.1" font-weight="600" fill="#6b7280" text-anchor="middle" letter-spacing="0.5">THE ONLY HOME FOR TRUCKERS</text>
      <line x1="82" y1="265" x2="188" y2="265" stroke="#e5e7eb" stroke-width="0.6"/>

      <!-- heading -->
      <text x="135" y="282" font-size="6.6" font-weight="800" fill="#111827" text-anchor="middle">Enter Your Phone</text>
      <text x="135" y="291" font-size="6.6" font-weight="800" fill="#111827" text-anchor="middle">Number</text>

      <!-- subtext -->
      <text x="135" y="303" font-size="3.6" fill="#6b7280" text-anchor="middle">Enter your phone number and we'll</text>
      <text x="135" y="309" font-size="3.6" fill="#6b7280" text-anchor="middle">text you a code to sign in.</text>

      <!-- label + input -->
      <text x="88" y="323" font-size="4.2" font-weight="700" fill="#111827">Phone Number</text>
      <rect x="88" y="327" width="94" height="16" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="0.6"/>
      <text x="93" y="337.5" font-size="4.4" fill="#9ca3af">123 456 7890</text>

      <!-- continue button -->
      <rect x="88" y="350" width="94" height="16" rx="8" fill="#4F57D8"/>
      <text x="135" y="360.5" font-size="4.8" font-weight="700" fill="#ffffff" text-anchor="middle">Continue</text>

      <!-- footer -->
      <rect x="82" y="439" width="106" height="34" fill="#1f2937"/>
      <text x="135" y="452" font-size="3.8" fill="#8b93f0" text-anchor="middle" text-decoration="underline">Privacy Policy &#38; Terms</text>
      <circle cx="120" cy="461.5" r="2" fill="#5b9bd8"/>
      <text x="135" y="463" font-size="3.1" fill="#9ca3af" text-anchor="middle">BY CUB VENTURES</text>
      <text x="135" y="470" font-size="2.7" fill="#6b7280" text-anchor="middle">&#169; 2026 CDLLife. All rights reserved.</text>
    </g>
    <rect x="82" y="227" width="106" height="246" rx="8" fill="none" stroke="#d8dadf" stroke-width="0.8"/>
    <text x="135" y="500" font-size="12.5" fill="#8b96b8" text-anchor="middle">Driver &#183; copilot.cdllife.com</text>

    <!-- SMS verify step -->
    <line x1="202" y1="352" x2="252" y2="352" stroke="#14b8a6" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHeadTeal)"/>
    <text x="227" y="337" font-size="11" fill="#7dd3c0" text-anchor="middle">SMS code</text>

    <rect x="255" y="315" width="150" height="80" rx="14" fill="#141b30" stroke="#818cf8" stroke-width="1.8"/>
    <circle cx="330" cy="345" r="13" fill="#141b30" stroke="#c7d2fe" stroke-width="1.4"/>
    <path d="M324,345 l4,5 l9,-10" fill="none" stroke="#c7d2fe" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="330" y="373" font-size="13" font-weight="500" fill="#e6ebf7" text-anchor="middle">Verify on confirm</text>
    <text x="330" y="389" font-size="10.5" fill="#8b96b8" text-anchor="middle">not before</text>

    <!-- SvelteKit server zone -->
    <rect x="245" y="230" width="615" height="300" rx="20" fill="#0e1424" fill-opacity="0.5" stroke="#14b8a6" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6,6"/>
    <text x="268" y="258" font-size="11" font-weight="600" letter-spacing="2" fill="#7dd3c0">SVELTEKIT 2 &#183; SSR</text>

    <line x1="405" y1="355" x2="452" y2="355" stroke="#14b8a6" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHeadTeal)"/>

    <!-- Proxy / session node -->
    <rect x="455" y="310" width="175" height="100" rx="16" fill="url(#nodeGrad)" opacity="0.35" filter="url(#softBlur)"/>
    <rect x="455" y="310" width="175" height="100" rx="16" fill="url(#nodeGrad)" stroke="#a5b4fc" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="542" cy="345" r="16" fill="none" stroke="#f7f9ff" stroke-width="3"/>
    <path d="M542,329 v8 M542,353 v8 M526,345 h8 M550,345 h8" stroke="#f7f9ff" stroke-width="3" stroke-linecap="round"/>
    <text x="542" y="386" font-size="14" font-weight="600" fill="#f7f9ff" text-anchor="middle">Proxy session</text>
    <text x="542" y="402" font-size="11" fill="#e6ebf7" text-anchor="middle">cookie fallback on race</text>

    <line x1="632" y1="355" x2="677" y2="355" stroke="#14b8a6" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHeadTeal)"/>

    <!-- Data ownership map -->
    <rect x="680" y="260" width="160" height="190" rx="14" fill="#141b30" stroke="#2a3452" stroke-width="1.6"/>
    <text x="760" y="286" font-size="11.5" font-weight="600" fill="#c3cbe6" text-anchor="middle">OWNERSHIP MAP</text>

    <rect x="696" y="300" width="128" height="34" rx="8" fill="#0e1424" stroke="#3a4568" stroke-width="1.2"/>
    <circle cx="712" cy="317" r="5" fill="#f59e0b"/>
    <text x="724" y="321" font-size="12" fill="#e6ebf7">drivers</text>

    <path d="M760,334 L760,352" stroke="#5b6791" stroke-width="1.6" stroke-dasharray="3,4"/>

    <rect x="696" y="352" width="128" height="34" rx="8" fill="#0e1424" stroke="#3a4568" stroke-width="1.2"/>
    <circle cx="712" cy="369" r="5" fill="#14b8a6"/>
    <text x="724" y="373" font-size="12" fill="#e6ebf7">leads</text>

    <path d="M760,386 L760,404" stroke="#5b6791" stroke-width="1.6" stroke-dasharray="3,4"/>

    <rect x="696" y="404" width="128" height="34" rx="8" fill="#0e1424" stroke="#3a4568" stroke-width="1.2"/>
    <circle cx="712" cy="421" r="5" fill="#818cf8"/>
    <text x="724" y="425" font-size="12" fill="#e6ebf7">jobs</text>

    <!-- Fixed path (amber) from mobile onboarding endpoint -->
    <path d="M870,480 C 870,440 870,400 842,380" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="7,6" marker-end="url(#arrowHeadAmber)"/>
    <rect x="860" y="480" width="195" height="44" rx="10" fill="#141b30" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="957" y="507" font-size="12.5" fill="#fcd9a4" text-anchor="middle">mobileUserCreated &#183; re-enabled</text>
    <text x="957" y="556" font-size="12" fill="#8b96b8" text-anchor="middle">24hr cron fallback &#8594; instant link</text>

    <!-- Caption -->
    <text x="80" y="562" font-size="13" fill="#8b96b8">Two-week ownership window &#183; shipped production-ready</text>

    <!-- Tech stack row -->
    <g font-size="13" fill="#c3cbe6">
      <rect x="80" y="594" width="110" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="135" y="616" text-anchor="middle">SvelteKit 2</text>

      <rect x="214" y="594" width="120" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="274" y="616" text-anchor="middle">TypeScript</text>

      <rect x="358" y="594" width="100" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="408" y="616" text-anchor="middle">Node.js</text>

      <rect x="482" y="594" width="120" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="542" y="616" text-anchor="middle">MongoDB</text>

      <rect x="626" y="594" width="150" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="701" y="616" text-anchor="middle">Tailwind CSS</text>
    </g>
  </g>
</svg>

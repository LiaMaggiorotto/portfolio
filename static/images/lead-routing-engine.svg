<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#171f38"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#2a3452"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="630" rx="28"/>
    </clipPath>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <marker id="arrowHeadGrey" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowHeadTeal" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#14b8a6"/>
    </marker>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1200" height="630" fill="url(#dots)" opacity="0.55"/>

    <!-- Header -->
    <text x="80" y="76" font-size="13" font-weight="600" letter-spacing="2.5" fill="#8b96b8">CDLLIFE &#183; LEAD ROUTING PLATFORM &#183; CASE STUDY</text>
    <text x="80" y="120" font-size="34" font-weight="700" fill="#f7f9ff">Post-Apply Lead Routing Engine</text>
    <text x="80" y="150" font-size="16" fill="#8b96b8">Weighted, sticky, and auditable &#183; safe to roll back per client</text>

    <!-- Lead source card -->
    <rect x="90" y="355" width="110" height="90" rx="14" fill="#141b30" stroke="#2a3452" stroke-width="2"/>
    <circle cx="118" cy="385" r="14" fill="#3a4568"/>
    <rect x="142" y="378" width="46" height="8" rx="4" fill="#3a4568"/>
    <rect x="142" y="394" width="34" height="8" rx="4" fill="#14b8a6" opacity="0.75"/>
    <text x="145" y="468" font-size="12.5" fill="#8b96b8" text-anchor="middle">New Lead</text>

    <!-- Every lead makes one trip through the router: there is no separate untouched lane -->
    <line x1="200" y1="400" x2="308" y2="400" stroke="#14b8a6" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHeadTeal)"/>

    <!-- Router hexagon -->
    <polygon points="463.6,357.5 463.6,442.5 390,485 316.4,442.5 316.4,357.5 390,315" fill="url(#nodeGrad)" opacity="0.35" filter="url(#softBlur)"/>
    <polygon points="463.6,357.5 463.6,442.5 390,485 316.4,442.5 316.4,357.5 390,315" fill="url(#nodeGrad)" stroke="#a5b4fc" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M390,372 L390,390 M390,390 L370,410 M390,390 L410,410" fill="none" stroke="#f7f9ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- sticky lock badge on hexagon -->
    <circle cx="463.6" cy="442.5" r="14" fill="#141b30" stroke="#a5b4fc" stroke-width="1.3"/>
    <rect x="457.6" y="440.5" width="12" height="10" rx="2" fill="#c7d2fe"/>
    <path d="M460.6,440.5 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#c7d2fe" stroke-width="2"/>

    <rect x="315" y="500" width="150" height="28" rx="14" fill="#141b30" stroke="#14b8a6" stroke-width="1.3" stroke-opacity="0.6"/>
    <text x="390" y="518" font-size="12.5" fill="#c9f7ef" text-anchor="middle" font-weight="600">Weighted Bucket</text>

    <!-- Branch arrows: the one live custom flow, legacy taking the remainder, and an open registry slot -->
    <path d="M427,336 C 500,325 560,322 608,322" fill="none" stroke="#14b8a6" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHeadTeal)"/>
    <path d="M463.6,400 L608,400" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHeadGrey)"/>
    <path d="M427,464 C 500,475 560,478 608,478" fill="none" stroke="#5b6791" stroke-width="2" stroke-dasharray="2,5" opacity="0.7"/>

    <!-- New Flow chip: the one custom flow actually live, with its real split -->
    <rect x="610" y="300" width="190" height="50" rx="12" fill="#141b30" stroke="#14b8a6" stroke-width="1.6"/>
    <rect x="628" y="313" width="12" height="10" rx="2" fill="#7dd3c0"/>
    <path d="M631,313 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#7dd3c0" stroke-width="2"/>
    <text x="655" y="323" font-size="14" fill="#e6ebf7" font-weight="500">New Flow &#183; 20%</text>
    <text x="655" y="339" font-size="9.5" fill="#8b96b8">Config optional per client</text>

    <!-- Legacy chip: the remainder bucket, not a separate untouched lane -->
    <rect x="610" y="375" width="190" height="50" rx="12" fill="#141b30" stroke="#5b6791" stroke-width="1.6"/>
    <circle cx="634" cy="400" r="6" fill="none" stroke="#9aa5c3" stroke-width="2"/>
    <text x="655" y="405" font-size="14" fill="#c3cbe6" font-weight="500">Legacy &#183; 80% remainder</text>

    <!-- Open registry slot: the architecture point, not a flow that actually ran -->
    <rect x="610" y="450" width="190" height="50" rx="12" fill="none" stroke="#3a4568" stroke-width="1.6" stroke-dasharray="5,4"/>
    <text x="705" y="472" font-size="13" fill="#6b7686" text-anchor="middle" font-weight="500">+ Next flow</text>
    <text x="705" y="488" font-size="10" fill="#555f7a" text-anchor="middle">one registry entry away</text>

    <!-- Converge to admin UI -->
    <path d="M800,325 C 830,325 840,345 858,365" fill="none" stroke="#14b8a6" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHeadTeal)"/>
    <path d="M800,400 C 830,400 840,395 858,391" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrowHeadGrey)"/>

    <rect x="860" y="355" width="100" height="72" rx="8" fill="#2a3452" stroke="#5b6791" stroke-width="1.3"/>
    <rect x="868" y="363" width="84" height="52" rx="4" fill="#0e1424"/>
    <rect x="878" y="398" width="10" height="14" fill="#14b8a6"/>
    <rect x="894" y="388" width="10" height="24" fill="#6366f1"/>
    <rect x="910" y="380" width="10" height="32" fill="#14b8a6" opacity="0.8"/>
    <rect x="900" y="427" width="20" height="10" fill="#2a3452"/>
    <rect x="885" y="437" width="50" height="6" rx="3" fill="#3a4568"/>
    <text x="910" y="486" font-size="12.5" fill="#8b96b8" text-anchor="middle">Admin UI &#183; Routing Visibility</text>
    <text x="910" y="502" font-size="10" fill="#6b7686" text-anchor="middle">Comparing CTR &#183; full-app applies</text>

    <!-- Per-client feature flags -->
    <g font-size="12.5" fill="#c3cbe6">
      <rect x="355" y="548" width="150" height="32" rx="16" fill="#141b30" stroke="#2a3452"/>
      <text x="369" y="569">Client A</text>
      <rect x="463" y="556" width="28" height="16" rx="8" fill="#123a34" stroke="#14b8a6" stroke-width="1"/>
      <circle cx="483" cy="564" r="6" fill="#14b8a6"/>

      <rect x="525" y="548" width="150" height="32" rx="16" fill="#141b30" stroke="#2a3452"/>
      <text x="539" y="569">Client B</text>
      <rect x="633" y="556" width="28" height="16" rx="8" fill="#123a34" stroke="#14b8a6" stroke-width="1"/>
      <circle cx="653" cy="564" r="6" fill="#14b8a6"/>

      <rect x="695" y="548" width="150" height="32" rx="16" fill="#141b30" stroke="#2a3452"/>
      <text x="709" y="569">Client C</text>
      <rect x="803" y="556" width="28" height="16" rx="8" fill="#1b2338" stroke="#3a4568" stroke-width="1"/>
      <circle cx="811" cy="564" r="6" fill="#5b6791"/>
    </g>

    <!-- Tech stack row -->
    <g font-size="13" fill="#c3cbe6">
      <rect x="80" y="594" width="100" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="130" y="616" text-anchor="middle">Node.js</text>

      <rect x="204" y="594" width="110" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="259" y="616" text-anchor="middle">Express</text>

      <rect x="338" y="594" width="120" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="398" y="616" text-anchor="middle">MongoDB</text>

      <rect x="482" y="594" width="170" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="567" y="616" text-anchor="middle">Mocha &#183; 37 tests</text>

      <rect x="676" y="594" width="150" height="34" rx="17" fill="#141b30" stroke="#2a3452"/>
      <text x="751" y="616" text-anchor="middle">Feature Flags</text>
    </g>
  </g>
</svg>
